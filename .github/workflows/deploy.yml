name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install schema validator deps
        working-directory: scripts
        run: npm ci

      - name: Validate ingredient + recipe JSON
        working-directory: scripts
        run: npx tsx validate.ts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate static pages
        run: python3 build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (Bing, Yandex)
        # Single POST to api.indexnow.org with every site URL.
        # Best-effort; doesn't fail the build if the API is down.
        run: |
          set -e
          KEY="cba1e421f06894f7b383823881c9cae7"
          HOST="www.theapothecary.diy"

          # Build the JSON payload from _site/urls.txt
          URLS_JSON=$(jq -R -s -c 'split("\n") | map(select(length > 0))' _site/urls.txt)

          PAYLOAD=$(jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "https://$HOST/$KEY.txt" \
            --argjson urlList "$URLS_JSON" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          echo "Submitting $(echo "$URLS_JSON" | jq 'length') URLs to IndexNow..."
          curl -fsS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$PAYLOAD" \
            && echo "IndexNow submission accepted." \
            || echo "IndexNow submission failed (non-blocking)."
        continue-on-error: true
